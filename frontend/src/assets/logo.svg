<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -45 100 100" data-logo="">
  <style>
    [data-logo] {
      --duration: 4s;
    }

    [data-logo] * {
      animation-duration: var(--duration);
      animation-timing-function: ease-in-out;
      animation-delay: calc(var(--duration) * var(--delay));
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }

    [data-logo]:is(:hover, [data-animated]) .logo-draw {
      animation-name: logo-draw;
      stroke-dasharray: 1;
    }

    @keyframes logo-draw {
      0% {
        stroke-dashoffset: 2;
      }
      30% {
        stroke-dashoffset: 1;
      }
      60% {
        stroke-dashoffset: 0;
      }
    }

    [data-logo]:is(:hover, [data-animated]) .logo-grow {
      animation-name: logo-grow;
    }

    @keyframes logo-grow {
      0%,
      60% {
        scale: 1;
      }
      30% {
        scale: 0;
      }
    }
  </style>

  <!-- bonds -->
  <g
    fill="none"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="4"
    mask="url(#logo-mask)"
  >
    <path
      class="logo-draw"
      style="--delay: 0.1"
      pathLength="1"
      d="
        M 0 0
        L -40 -25
        L -40 25
      "
    />
    <path
      class="logo-draw"
      style="--delay: 0.2"
      pathLength="1"
      d="
        M 0 0
        L 40 -25
        L 40 25
      "
    />
    <path
      class="logo-draw"
      style="--delay: 0.3"
      pathLength="1"
      d="
        M 0 0
        L 0 45
      "
    />
  </g>

  <!-- electrons -->
  <g fill="currentColor">
    <g transform="translate(-40, -25)">
      <circle class="logo-grow" style="--delay: 0" r="8" />
    </g>
    <g transform="translate(40, -25)">
      <circle class="logo-grow" style="--delay: 0.1" r="8" />
    </g>
    <g transform="translate(0, 45)">
      <circle class="logo-grow" style="--delay: 0.2" r="8" />
    </g>
  </g>

  <!-- nucleus -->
  <circle
    class="logo-grow"
    style="--delay: 0.4"
    fill="none"
    stroke="currentColor"
    stroke-width="6"
    cx="0"
    cy="0"
    r="9"
  />

  <defs>
    <!-- nucleus cutout -->
    <mask id="logo-mask">
      <rect fill="white" x="-50" y="-50" width="100" height="100" />
      <g fill="black">
        <g transform="translate(-40, -25)">
          <circle class="logo-grow" style="--delay: 0" r="12" />
        </g>
        <g transform="translate(40, -25)">
          <circle class="logo-grow" style="--delay: 0.1" r="12" />
        </g>
        <g transform="translate(0, 45)">
          <circle class="logo-grow" style="--delay: 0.2" r="12" />
        </g>
        <circle class="logo-grow" style="--delay: 0.4" cx="0" cy="0" r="16" />
      </g>
    </mask>
  </defs>
</svg>
